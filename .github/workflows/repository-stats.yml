name: Repository all-time statistics

on:
  schedule:
    # Four times per UTC day. Offset from the hour to reduce GitHub cron congestion.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-all-time-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect and render statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/github_all_time_stats.py

      - name: Commit generated statistics
        run: |
          if git diff --quiet -- README.md stats/; then
            echo "No statistics changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md stats/
          git commit -m "chore(stats): update repository statistics [skip ci]"
          git push
